name: Deploy playtest

# Deploys this branch to its own Worker, "overrun-playtest", so the live "overrun" Worker is never
# touched. Runs on a push to the `playtest` branch, or by hand from the Actions tab.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers overview page

on:
  push:
    branches: [playtest]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-playtest
  cancel-in-progress: true

jobs:
  deploy:
    name: Unit tests, then wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Check the secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            exit 1
          fi
      - name: Deploy
        run: npx wrangler deploy --name overrun-playtest
